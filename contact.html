      <!-- =================================================================
           FORM
           "required" (REQUISITO) rende i campi obbligatori.
           type="email" verifica il formato dell'indirizzo.
           Nessuna email mostrata in chiaro (anti-spam).
           OPZIONE EmailJS (esercizio facoltativo) : esempio commentato in fondo.
           ================================================================= -->
      <form class="form-contact" id="form-contact">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Il tuo nome" required>

        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="latua@email.com" required>

        <label for="oggetto" class="form-label">Oggetto</label>
        <input type="text" class="form-control" id="oggetto" name="oggetto" placeholder="L'oggetto del messaggio" required>

        <label for="messaggio" class="form-label">Messaggio</label>
        <textarea class="form-control" id="messaggio" name="messaggio" rows="5" placeholder="Il tuo messaggio" required></textarea>

        <div class="mt-2">
          <button type="submit" class="btn-accent">Invia il messaggio</button>
        </div>
      </form>
    </div>
  </section>
