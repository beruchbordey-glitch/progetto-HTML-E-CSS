      <!-- =================================================================
           FORM collegato a EmailJS
           "required" (REQUISITO) rende i campi obbligatori.
           type="email" verifica il formato dell'indirizzo.
           Nessuna email mostrata in chiaro (anti-spam).
           L'invio reale avviene tramite EmailJS (vedi script in fondo).
           ================================================================= -->
      <form class="form-contact" id="form-contact">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" placeholder="Il tuo nome" required>

        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="latua@email.com" required>

        <label for="oggetto" class="form-label">Oggetto</label>
        <input type="text" class="form-control" id="oggetto" name="oggetto" placeholder="L'oggetto del messaggio" required>

        <label for="messaggio" class="form-label">Messaggio</label>
        <textarea class="form-control" id="messaggio" name="messaggio" rows="5" placeholder="Il tuo messaggio" required></textarea>

        <div class="mt-2">
          <button type="submit" class="btn-accent" id="btn-invia">Invia il messaggio</button>
        </div>

        <!-- message de confirmation / erreur affiché après l'envoi -->
        <p id="form-stato" style="margin-top:18px;font-family:'Space Grotesk',sans-serif;font-size:0.95rem;"></p>
      </form>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- =====================================================================
       EmailJS : invio reale del form alla mia email
       1) libreria EmailJS
       2) inizializzazione con la Public Key
       3) all'invio del form, EmailJS manda l'email usando Service e Template
       ===================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // inizializzazione con la chiave pubblica
    emailjs.init({ publicKey: "AIMg-W1TG12jsOikS" });

    const form  = document.getElementById("form-contact");
    const btn   = document.getElementById("btn-invia");
    const stato = document.getElementById("form-stato");

    form.addEventListener("submit", function (e) {
      e.preventDefault();                 // evita il ricaricamento della pagina
      btn.disabled = true;
      btn.textContent = "Invio in corso...";
      stato.textContent = "";

      // dati del form, inviati esplicitamente (metodo send, più affidabile)
      const parametri = {
        nome:      document.getElementById("nome").value,
        email:     document.getElementById("email").value,
        oggetto:   document.getElementById("oggetto").value,
        messaggio: document.getElementById("messaggio").value
      };

      emailjs.send("service_qch1b4b", "template_0vfqluy", parametri)
        .then(function () {
          stato.style.color = "#3B82F6";
          stato.textContent = "Messaggio inviato, grazie ! Ti risponderò presto.";
          form.reset();
          btn.disabled = false;
          btn.textContent = "Invia il messaggio";
        })
        .catch(function (err) {
          // mostra il dettaglio tecnico per aiutare la diagnosi
          stato.style.color = "#E8591A";
          stato.textContent = "Si è verificato un errore. Riprova o scrivimi su LinkedIn.";
          console.error("EmailJS error:", err);
          btn.disabled = false;
          btn.textContent = "Invia il messaggio";
        });
    });
  </script>
